apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-api
  labels: {app.kubernetes.io/name: taskboard-api, app.kubernetes.io/part-of: taskboard}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {app: taskboard-api}
  template:
    metadata:
      labels: {app: taskboard-api, app.kubernetes.io/part-of: taskboard}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: REDIS_URL
              value: "redis://taskboard-redis:{{ .Values.redis.service.port }}/0"
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-api
  labels: {app.kubernetes.io/name: taskboard-api, app.kubernetes.io/part-of: taskboard}
spec:
  selector: {app: taskboard-api}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
